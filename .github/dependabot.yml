version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /dropr/api
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    cooldown:
      default-days: 3
    ignore:
      # A new Node major is a decision (ADR-0001), together with .nvmrc
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
      include: scope
