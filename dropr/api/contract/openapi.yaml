openapi: 3.1.0
info:
  title: Dropr API
  version: 0.1.0
  license:
    name: Proprietary
security:
  - ApiKey: []
paths:
  /v1/zones:
    get:
      operationId: listZones
      summary: List coverage zones
      tags:
        - zones
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneList'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/zones/{zoneId}:
    get:
      operationId: getZone
      summary: Get a coverage zone
      tags:
        - zones
      parameters:
        - schema:
            type: string
            pattern: ^[a-z0-9-]{1,32}$
          in: path
          name: zoneId
          required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        code:
          type: string
        detail:
          type: string
      required:
        - type
        - title
        - status
        - code
      additionalProperties: false
      description: Error response (RFC 9457)
    Coordinates:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
      required:
        - lat
        - lng
      additionalProperties: false
    Zone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        center:
          $ref: '#/components/schemas/Coordinates'
        radiusMeters:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        baseFeeCents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - id
        - name
        - center
        - radiusMeters
        - baseFeeCents
      additionalProperties: false
    ZoneList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
      required:
        - items
      additionalProperties: false
